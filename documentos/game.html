<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego de Moni y el Gatito</title>
    <style>
        body { margin: 0; overflow: hidden; background: #333; font-family: 'Arial', sans-serif; }
        canvas { display: block; margin: 0 auto; background: #87CEEB; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; font-size: 20px; text-shadow: 2px 2px 0 #000; pointer-events: none; }
        #startScreen, #gameOverScreen, #winScreen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8); color: white; padding: 20px; border-radius: 10px;
            text-align: center; display: none;
        }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; background: #ff69b4; border: none; color: white; border-radius: 5px; margin-top: 10px; }
        button:hover { background: #ff1493; }
    </style>
</head>
<body>

<div id="ui">
    Vidas: <span id="livesDisplay">3</span> | Corazones al gato: <span id="scoreDisplay">0</span>/5
</div>

<div id="startScreen" style="display: block;">
    <h1>Moni vs El Gatito</h1>
    <p>Mueve a Moni con ⬅️ ➡️ o A D</p>
    <p>Dispara corazones con ESPACIO</p>
    <p>¡Hazle 5 caricias (corazones) para ganar!</p>
    <button onclick="startGame()">JUGAR</button>
</div>

<div id="gameOverScreen">
    <h1>¡Oh no! Perdiste</h1>
    <p>El gatito te atrapó.</p>
    <button onclick="resetGame()">Intentar de nuevo</button>
</div>

<div id="winScreen">
    <h1>¡Ganaste!</h1>
    <p>El gatito ahora es tu amigo. ❤️</p>
    <button onclick="resetGame()">Jugar otra vez</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Ajustar canvas al tamaño de la ventana
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Estado del juego
    let gameRunning = false;
    let lives = 3;
    let hits = 0;
    const maxHits = 5;
    let frames = 0;

    // Entidades
    const player = { x: 0, y: 0, width: 40, height: 60, speed: 5, color: '#FF69B4' };
    const enemy = { x: 0, y: 0, width: 50, height: 40, speed: 2, color: '#FFA500' };
    let projectiles = [];
    let clouds = [];

    // Controles
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => {
        keys[e.code] = false;
        if (e.code === 'Space' && gameRunning) shoot();
    });

    function init() {
        player.x = canvas.width / 2;
        player.y = canvas.height - 100;
        enemy.x = Math.random() * (canvas.width - 50);
        enemy.y = 100;
        projectiles = [];
        lives = 3;
        hits = 0;
        updateUI();
        
        // Crear nubes iniciales
        clouds = [];
        for(let i=0; i<5; i++) {
            clouds.push({
                x: Math.random() * canvas.width,
                y: Math.random() * (canvas.height/2),
                size: 30 + Math.random() * 20,
                speed: 0.5 + Math.random()
            });
        }
    }

    function startGame() {
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('gameOverScreen').style.display = 'none';
        document.getElementById('winScreen').style.display = 'none';
        init();
        gameRunning = true;
        loop();
    }

    function resetGame() {
        startGame();
    }

    function shoot() {
        projectiles.push({
            x: player.x,
            y: player.y - 30,
            radius: 10,
            speed: 7
        });
    }

    function updateUI() {
        document.getElementById('livesDisplay').innerText = lives;
        document.getElementById('scoreDisplay').innerText = hits;
    }

    // Dibujar a Moni (Heroína)
    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);
        
        // Cuerpo (Vestido)
        ctx.fillStyle = '#FF69B4'; // Rosa fuerte
        ctx.beginPath();
        ctx.moveTo(0, -30);
        ctx.lineTo(20, 30);
        ctx.lineTo(-20, 30);
        ctx.fill();

        // Cabeza
        ctx.fillStyle = '#FFE0BD'; // Piel
        ctx.beginPath();
        ctx.arc(0, -40, 20, 0, Math.PI * 2);
        ctx.fill();

        // Pelo (Largo y negro)
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(0, -45, 22, Math.PI, 0); // Parte superior
        ctx.lineTo(25, -10);
        ctx.lineTo(15, 20); // Lado derecho
        ctx.lineTo(-15, 20); 
        ctx.lineTo(-25, -10);
        ctx.fill();

        // Ojos
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-7, -42, 2, 0, Math.PI*2);
        ctx.arc(7, -42, 2, 0, Math.PI*2);
        ctx.fill();

        // Sonrisa
        ctx.beginPath();
        ctx.arc(0, -35, 5, 0, Math.PI, false);
        ctx.stroke();

        ctx.restore();
    }

    // Dibujar al Gatito (Enemigo)
    function drawEnemy() {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);

        // Cuerpo
        ctx.fillStyle = '#FFA500'; // Naranja
        ctx.beginPath();
        ctx.ellipse(0, 0, 25, 15, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cabeza
        ctx.beginPath();
        ctx.arc(0, -10, 18, 0, Math.PI * 2);
        ctx.fill();

        // Orejas
        ctx.beginPath();
        ctx.moveTo(-10, -20);
        ctx.lineTo(-15, -35);
        ctx.lineTo(-5, -25);
        ctx.moveTo(10, -20);
        ctx.lineTo(15, -35);
        ctx.lineTo(5, -25);
        ctx.fill();

        // Ojos
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-6, -12, 2, 0, Math.PI*2);
        ctx.arc(6, -12, 2, 0, Math.PI*2);
        ctx.fill();

        // Bigotes
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(5, -5); ctx.lineTo(20, -8);
        ctx.moveTo(5, 0); ctx.lineTo(20, 0);
        ctx.moveTo(-5, -5); ctx.lineTo(-20, -8);
        ctx.moveTo(-5, 0); ctx.lineTo(-20, 0);
        ctx.stroke();

        // Cola
        ctx.beginPath();
        ctx.moveTo(20, 0);
        ctx.quadraticCurveTo(30, -10, 35, 0);
        ctx.stroke();

        ctx.restore();
    }

    function drawHeart(x, y, size, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = color;
        ctx.beginPath();
        // Forma de corazón usando curvas bezier
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-size/2, -size/2, -size, size/3, 0, size);
        ctx.bezierCurveTo(size, size/3, size/2, -size/2, 0, 0);
        ctx.fill();
        ctx.restore();
    }

    function drawBackground() {
        // Cielo ya está por CSS, dibujemos suelo y nubes
        // Suelo
        ctx.fillStyle = '#90EE90';
        ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

        // Nubes
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        clouds.forEach(cloud => {
            ctx.beginPath();
            ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
            ctx.arc(cloud.x + cloud.size*0.8, cloud.y - cloud.size*0.5, cloud.size*0.9, 0, Math.PI * 2);
            ctx.arc(cloud.x + cloud.size*1.5, cloud.y, cloud.size*0.8, 0, Math.PI * 2);
            ctx.fill();
            
            // Mover nube
            cloud.x += cloud.speed;
            if (cloud.x > canvas.width + 50) cloud.x = -50;
        });
    }

    function checkCollision(rect1, rect2) {
        // Simplificada: distancia entre centros
        const dx = rect1.x - rect2.x;
        const dy = rect1.y - rect2.y;
        const distance = Math.sqrt(dx*dx + dy*dy);
        return distance < (rect1.width/2 + rect2.width/2); 
    }

    function loop() {
        if (!gameRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frames++;

        drawBackground();

        // Movimiento Jugador
        if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 20) player.x -= player.speed;
        if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - 20) player.x += player.speed;

        // Movimiento Enemigo (Persigue suavemente al jugador en X)
        if (enemy.x < player.x) enemy.x += enemy.speed;
        else enemy.x -= enemy.speed;
        
        // Enemigo rebota un poco en Y
        enemy.y = 100 + Math.sin(frames * 0.05) * 20;

        // Proyectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            p.y -= p.speed;
            drawHeart(p.x, p.y, 15, 'red');

            // Colisión con enemigo
            // Distancia simple
            let dist = Math.hypot(p.x - enemy.x, p.y - enemy.y);
            if (dist < 30) {
                hits++;
                projectiles.splice(i, 1);
                updateUI();
                
                // Efecto visual de golpe
                enemy.x += (Math.random() - 0.5) * 20; 
                
                if (hits >= maxHits) {
                    gameRunning = false;
                    document.getElementById('winScreen').style.display = 'block';
                }
                continue;
            }

            if (p.y < 0) projectiles.splice(i, 1);
        }

        // Colisión Jugador - Enemigo
        let distPlayerEnemy = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        if (distPlayerEnemy < 40) {
            lives--;
            updateUI();
            // Empujar enemigo lejos
            enemy.y -= 100;
            if (lives <= 0) {
                gameRunning = false;
                document.getElementById('gameOverScreen').style.display = 'block';
            }
        }

        drawPlayer();
        drawEnemy();

        requestAnimationFrame(loop);
    }

    // Dibujar pantalla inicial estática
    resize();
    drawBackground();
    
</script>
</body>
</html>
